<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep Obsidian Canvas with Soft Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="#0C0D11" />
  
  <!-- Subtle Warm Amber Starlight Ambient Radial Glow -->
  <radialGradient id="aurAmbientGlow" cx="45%" cy="38%" r="62%">
    <stop offset="0%" stop-color="#CFA276" stop-opacity="0.28" />
    <stop offset="60%" stop-color="#CFA276" stop-opacity="0.06" />
    <stop offset="100%" stop-color="#0C0D11" stop-opacity="0" />
  </radialGradient>
  <rect width="64" height="64" rx="16" fill="url(#aurAmbientGlow)" />
  
  <!-- Hairline Border for Optical Definition on Light/Dark Tabs -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Hero Hand-Drawn Doodle Star (Continuous-Stroke Sketch with Overlaps) -->
  <!-- Tilted slightly (~8°) with authentic pen crossing lines from Reference 1 -->
  <path 
    d="M 23 48.5 L 30.5 13.5 L 42 49 L 14 26 L 49.5 24.5 Z" 
    stroke="#FDFBF7" 
    stroke-width="3.6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Secondary Hand-Drawn Sketch Star (Bottom-Left) -->
  <path 
    d="M 11.5 54.5 L 14 46 L 18 53.5 L 9 49 L 19 48 Z" 
    stroke="#DDD8CE" 
    stroke-width="1.9" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Companion Sparkle Star (Mid-Right, Warm Gold Tone from Reference 2) -->
  <path 
    d="M 47.5 48.5 L 49 42.5 L 53 48 L 46 45 L 53.5 44.5 Z" 
    stroke="#E5BE90" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
