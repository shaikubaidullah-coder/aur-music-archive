<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Vinyl Edge with dark depth and subtle rim light -->
  <circle cx="32" cy="32" r="30" fill="#0d0e12" stroke="#2a2c35" stroke-width="1.5" />
  
  <!-- Subtle Concentric Sound Grooves -->
  <circle cx="32" cy="32" r="25" stroke="#f3efe9" stroke-opacity="0.12" stroke-width="0.8" />
  <circle cx="32" cy="32" r="20" stroke="#f3efe9" stroke-opacity="0.16" stroke-width="0.8" />
  
  <!-- Central Record Hub / Label in Warm Deep Tone with Brass Accent -->
  <circle cx="32" cy="32" r="14.5" fill="#171820" stroke="#d4af37" stroke-opacity="0.75" stroke-width="1.25" />
  
  <!-- Delicate Inner Ring -->
  <circle cx="32" cy="32" r="12.5" stroke="#d4af37" stroke-opacity="0.25" stroke-width="0.5" stroke-dasharray="2 1.5" />
  
  <!-- Architectural 'A' Listening Mark -->
  <!-- Clean triangular apex pointing upward like a precision stylus / monogram -->
  <path 
    d="M 32 21.5 L 24.5 38.5 M 32 21.5 L 39.5 38.5" 
    stroke="#f3efe9" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  <line 
    x1="27" 
    y1="33" 
    x2="37" 
    y2="33" 
    stroke="#d4af37" 
    stroke-width="1.6" 
    stroke-linecap="round" 
  />
  
  <!-- Central Turntable Spindle Point -->
  <circle cx="32" cy="32" r="1.6" fill="#0d0e12" stroke="#d4af37" stroke-width="0.9" />
</svg>
